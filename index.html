<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main">
    <div class="container">
      <img src="./assets/illustration-hero.svg" alt="Hero Illustration">
      <h1 class="heading">Order Summary</h1>
      <p class="summary-para">
        You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
      </p>
      <div class="plan-details">
        <div class="plan-text">
          <img src="./assets/icon-music.svg" alt="Music Icon">
          <div>
            <h3>Annual Plan</h3>
            <p>$59.99/year</p>
          </div>
        </div>
        <div class="change-link">
          <a href="#">Change</a>
        </div>
      </div>
      <button class="proceed-btn">Proceed to Payment</button>
      <button class="cancel-order">Cancel Order</button>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio.Do</a>.
    Coded by <a href="https://www.github.com/Apoorva" target="_blank" rel="noopener noreferrer">Apoorva</a>.
  </footer>
</body>
</html>
