<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="main">
    <div class="container">
      <img src="./assets/illustration-hero.svg" alt="hero illustration">

      <h1 class="heading">Order Summary</h1>
      
      <p class="summary-para">
        You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
      </p>

      <div class="plan-details">
        <div class="plan-text">
          <img src="./assets/icon-music.svg" alt="music icon">
          <div>
            <strong>Annual Plan</strong>
            <p>$59.99/year</p>
          </div>
        </div>
        <div class="change-link">
          <a href="#">Change</a>
        </div>
      </div>

      <button class="proceed-btn">Proceed to Payment</button>
      <button class="cancel-order">Cancel Order</button>
    </div>
  </main>
</body>
</html>
